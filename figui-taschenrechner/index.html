<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Taschenrechner</title>
<style>
  /*
    Keine eigenen Farbwerte: FigUI injiziert seine Theme-Variablen
    automatisch in :root (siehe PLUGIN_GUIDE.md -> "Theme"). Das
    Plugin passt sich damit selbstständig an Light/Dark-Theme an.
  */
  :root {
    --radius: 3px; /* wie gewünscht: knapp gerundete Ecken */
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    touch-action: manipulation;
    overscroll-behavior: none;
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg, #16181a);
    color: var(--text-primary, #e8eaec);
    font-family: ui-sans-serif, system-ui, sans-serif;
    padding: clamp(8px, 3vw, 20px);
    display: flex;
    flex-direction: column;
  }

  .calculator {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0; /* erlaubt dem Grid darunter, wirklich zu schrumpfen/wachsen */
  }

  .display {
    background: var(--surface, #202427);
    border: 1px solid var(--border, #33383d);
    border-radius: var(--radius);
    padding: clamp(16px, 5vh, 28px) 14px;
    margin-bottom: clamp(10px, 2.5vh, 18px);
    text-align: right;
    flex-shrink: 0;
  }

  .display .expression {
    font-size: clamp(13px, 4vw, 20px);
    min-height: 1.3em;
    color: var(--text-muted, #9aa0a6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .display .current {
    font-size: clamp(22px, 8vw, 40px);
    font-weight: 700;
    min-height: 1.15em;
    word-break: break-all;
    color: var(--text-primary, #e8eaec);
  }

  .display .current.error {
    color: var(--danger, #e05d5d);
  }

  .buttons {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: clamp(6px, 1.8vw, 12px);
    min-height: 0;
  }

  button {
    border: 1px solid var(--border, #33383d);
    border-radius: var(--radius);
    width: 100%;
    height: 100%;
    min-height: 0;
    font-size: clamp(18px, 5.5vw, 26px);
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface, #2c3034);
    color: var(--text-primary, #e8eaec);
    transition: filter 0.05s ease, transform 0.05s ease;
  }

  button:active,
  button.pressed {
    transform: translateY(1px);
    filter: brightness(1.15);
  }

  button.fn {
    background: var(--elevated, #383d42);
    color: var(--text-muted, #c5cad0);
  }

  button.op {
    background: var(--elevated, #383d42);
    color: var(--accent, #f0a030);
    border-color: var(--accent, #f0a030);
  }

  button.eq {
    background: var(--accent, #f0a030);
    color: var(--bg, #16181a);
    border-color: var(--accent, #f0a030);
    grid-column: span 4;
  }

  button.zero {
    grid-column: span 2;
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="expression" id="expression">&nbsp;</div>
    <div class="current" id="current">0</div>
  </div>

  <div class="buttons">
    <button class="fn" data-action="clear">C</button>
    <button class="fn" data-action="backspace">⌫</button>
    <button class="fn" data-action="sqrt">√</button>
    <button class="op" data-action="divide">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-action="multiply">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-action="subtract">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-action="add">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-action="decimal">,</button>
    <button class="fn" data-action="square">x²</button>

    <button class="eq" data-action="equals">=</button>
  </div>
</div>

<script>
  /* ---- FigUI Plugin API Helper (aus PLUGIN_GUIDE.md) ---- */
  let msgId = 0;
  const pending = {};

  function call(method, params) {
    return new Promise((resolve, reject) => {
      const id = String(++msgId);
      pending[id] = { resolve, reject };
      window.parent.postMessage(
        { type: 'fluid-request', id, method, params: params ?? {} }, '*'
      );
    });
  }

  window.addEventListener('message', e => {
    if (e.data?.type === 'fluid-response') {
      const p = pending[e.data.id];
      if (p) {
        delete pending[e.data.id];
        e.data.error ? p.reject(new Error(e.data.error)) : p.resolve(e.data.result);
      }
    }
  });

  /* Letzten Zustand geräteseitig merken (getSettings/saveSettings) */
  async function restoreLastValue() {
    try {
      const settings = await call('getSettings');
      if (settings && typeof settings.lastValue === 'string') {
        currentValue = settings.lastValue;
        updateDisplay();
      }
    } catch (err) {
      // Kein Problem, falls z. B. im Demo-Modus ohne Verbindung getestet wird
    }
  }

  function persistValue() {
    call('saveSettings', { data: { lastValue: currentValue } }).catch(() => {});
  }

  /* ---- Taschenrechner-Logik ---- */
  const expressionEl = document.getElementById('expression');
  const currentEl = document.getElementById('current');

  let currentValue = '0';
  let previousValue = null;
  let pendingOperator = null;
  let overwrite = true;

  function formatNumber(numStr) {
    if (numStr === 'Error') return numStr;
    return numStr.replace('.', ',');
  }

  function updateDisplay() {
    currentEl.textContent = formatNumber(currentValue);
    currentEl.classList.toggle('error', currentValue === 'Error');
    if (pendingOperator && previousValue !== null) {
      const opSymbol = { add: '+', subtract: '−', multiply: '×', divide: '÷' }[pendingOperator];
      expressionEl.textContent = `${formatNumber(previousValue)} ${opSymbol}`;
    } else {
      expressionEl.textContent = '\u00A0';
    }
  }

  function inputDigit(digit) {
    if (currentValue === 'Error') { currentValue = '0'; overwrite = true; }
    if (overwrite) {
      currentValue = digit === '0' ? '0' : digit;
      overwrite = false;
    } else {
      currentValue = currentValue === '0' ? digit : currentValue + digit;
    }
  }

  function inputDecimal() {
    if (currentValue === 'Error') { currentValue = '0'; overwrite = false; }
    if (overwrite) { currentValue = '0.'; overwrite = false; return; }
    if (!currentValue.includes('.')) currentValue += '.';
  }

  function clearAll() {
    currentValue = '0';
    previousValue = null;
    pendingOperator = null;
    overwrite = true;
  }

  function backspace() {
    if (currentValue === 'Error' || overwrite) { currentValue = '0'; overwrite = true; return; }
    if (currentValue.length <= 1 || (currentValue.length === 2 && currentValue.startsWith('-'))) {
      currentValue = '0';
      overwrite = true;
    } else {
      currentValue = currentValue.slice(0, -1);
    }
  }

  function compute(a, b, operator) {
    switch (operator) {
      case 'add': return a + b;
      case 'subtract': return a - b;
      case 'multiply': return a * b;
      case 'divide': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function setOperator(operator) {
    if (currentValue === 'Error') return;
    if (pendingOperator !== null && !overwrite) {
      const result = compute(parseFloat(previousValue), parseFloat(currentValue), pendingOperator);
      if (isNaN(result)) {
        currentValue = 'Error';
        previousValue = null;
        pendingOperator = null;
        overwrite = true;
        return;
      }
      previousValue = String(result);
      currentValue = String(result);
    } else {
      previousValue = currentValue;
    }
    pendingOperator = operator;
    overwrite = true;
  }

  function equals() {
    if (pendingOperator === null || previousValue === null || currentValue === 'Error') return;
    const result = compute(parseFloat(previousValue), parseFloat(currentValue), pendingOperator);
    currentValue = isNaN(result) ? 'Error' : String(result);
    previousValue = null;
    pendingOperator = null;
    overwrite = true;
  }

  function square() {
    if (currentValue === 'Error') return;
    const val = parseFloat(currentValue);
    currentValue = String(val * val);
    overwrite = true;
  }

  function sqrt() {
    if (currentValue === 'Error') return;
    const val = parseFloat(currentValue);
    currentValue = val < 0 ? 'Error' : String(Math.sqrt(val));
    overwrite = true;
  }

  function handlePress(btn) {
    const num = btn.getAttribute('data-num');
    const action = btn.getAttribute('data-action');

    if (num !== null) {
      inputDigit(num);
    } else {
      switch (action) {
        case 'clear': clearAll(); break;
        case 'backspace': backspace(); break;
        case 'decimal': inputDecimal(); break;
        case 'add':
        case 'subtract':
        case 'multiply':
        case 'divide':
          setOperator(action);
          break;
        case 'equals': equals(); break;
        case 'square': square(); break;
        case 'sqrt': sqrt(); break;
      }
    }
    updateDisplay();
    persistValue();
  }

  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('touchstart', () => btn.classList.add('pressed'), { passive: true });
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      btn.classList.remove('pressed');
      handlePress(btn);
    });
    btn.addEventListener('touchcancel', () => btn.classList.remove('pressed'));
    btn.addEventListener('click', () => handlePress(btn));
  });

  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') { inputDigit(e.key); updateDisplay(); persistValue(); }
    else if (e.key === '.' || e.key === ',') { inputDecimal(); updateDisplay(); persistValue(); }
    else if (e.key === '+') { setOperator('add'); updateDisplay(); }
    else if (e.key === '-') { setOperator('subtract'); updateDisplay(); }
    else if (e.key === '*') { setOperator('multiply'); updateDisplay(); }
    else if (e.key === '/') { e.preventDefault(); setOperator('divide'); updateDisplay(); }
    else if (e.key === 'Enter' || e.key === '=') { equals(); updateDisplay(); persistValue(); }
    else if (e.key === 'Backspace') { backspace(); updateDisplay(); persistValue(); }
    else if (e.key === 'Escape') { clearAll(); updateDisplay(); persistValue(); }
  });

  restoreLastValue();
  updateDisplay();
</script>

</body>
</html>
